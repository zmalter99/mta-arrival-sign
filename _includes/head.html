<!-- Title & Meta -->
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}"/>
<meta charset="UTF-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
{% if page.no_index %}
<meta name="robots" content="noindex,nofollow">
{% endif %}

<!-- Icons -->
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/img/apple-touch-icon.png">

<!-- Home Screen App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">

<!-- CSS -->
<link href="{{ site.baseurl }}/assets/css/global.css?v={{ 'now' | date: '%s' }}" rel="stylesheet">
{% for css in page.css %}
<link href="{{ site.baseurl }}/assets/css/{{ css }}.css?v={{ 'now' | date: '%s' }}" rel="stylesheet">
{% endfor %}

<!-- JS -->
{% for js in page.js %}
<script defer src="{{ site.baseurl }}/assets/js/{{ js }}.js?v={{ 'now' | date: '%s' }}"></script>
{% endfor %}
