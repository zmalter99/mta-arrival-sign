<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trains">
    <title>23 St Trains</title>
    <style>
        /********************* Base *********************/

        :root {
            --black: #000000;
            --white: #ffffff;
            --grey: #999999;
            --dim: #555555;
            --line: #333333;
            --row-line: #1a1a1a;
            --red: #ee3333;
            --orange: #ff6319;
            --green: #00933c;
            --route-grey: #808183;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--black);
            color: var(--white);
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /********************* Sign *********************/

        #sign {
            display: flex;
            gap: 20px;
            box-sizing: border-box;
            height: 100%;
            padding: 12px max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
        }

        .signStation {
            flex: 1;
            min-width: 0;
        }

        .signStationTitle {
            margin: 0 0 4px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--line);
            font-size: 21px;
            font-weight: 700;
            white-space: nowrap;
        }

        .signStationTitleSubtitle {
            color: var(--grey);
            font-weight: 400;
        }

        .signStationDirection {
            margin: 8px 0 2px;
            color: var(--grey);
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .signStationRow {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 48px;
            border-bottom: 1px solid var(--row-line);
        }

        .signStationRowBullet {
            display: flex;
            flex: none;
            align-items: center;
            justify-content: center;
            width: 36px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--route-grey);
        }

        .signStationRowBullet.orange {
            background: var(--orange);
        }

        .signStationRowBullet.green {
            background: var(--green);
        }

        .signStationRowBullet.express {
            border-radius: 0;
            transform: rotate(45deg) scale(0.75);
        }

        .signStationRowBulletText {
            font-size: 26px;
            font-weight: 700;
        }

        .signStationRowBullet.express .signStationRowBulletText {
            transform: rotate(-45deg) scale(1.33);
        }

        .signStationRowDestination {
            flex: 1;
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 22px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .signStationRowDestinationFull {
            display: none;
        }

        .signStationRowDestinationShort {

        }

        .signStationRowMinutes {
            flex: none;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .signStationRowMinutesUnit {
            margin-left: 2px;
            color: var(--grey);
            font-size: 15px;
            font-weight: 400;
        }

        .signStationEmpty {
            height: 48px;
            margin: 0;
            color: var(--dim);
            font-size: 18px;
            line-height: 48px;
        }

        /********************* Footer *********************/

        #footer {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            padding: 6px max(24px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            color: var(--dim);
            font-size: 13px;
        }

        #footerClock {

        }

        #footerStatus {

        }

        #footerStatus.offline {
            color: var(--red);
        }

        /********************* Portrait *********************/

        @media (orientation: portrait) {
            #sign {
                flex-direction: column;
                gap: 12px;
                padding: max(16px, env(safe-area-inset-top)) 12px 0;
            }

            .signStation {
                flex: none;
            }

            .signStationTitle {
                font-size: 22px;
            }

            .signStationDirection {
                font-size: 13px;
            }

            .signStationRow {
                height: 42px;
            }

            .signStationRowBullet {
                width: 32px;
            }

            .signStationRowBulletText {
                font-size: 21px;
            }

            .signStationRowDestination {
                font-size: 19px;
            }

            .signStationRowDestinationFull {
                display: inline;
            }

            .signStationRowDestinationShort {
                display: none;
            }

            .signStationRowMinutes {
                font-size: 22px;
            }

            .signStationRowMinutesUnit {
                font-size: 13px;
            }

            .signStationEmpty {
                height: 42px;
                font-size: 15px;
                line-height: 42px;
            }

            #footer {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="sign"><!-- Dynamic JS --></div>
    <div id="footer">
        <span id="footerClock"><!-- Dynamic JS --></span>
        <span id="footerStatus"><!-- Dynamic JS --></span>
    </div>

    <script>
        /********************* Settings *********************/

        const STATIONS = [
            { name: "23 St", subtitle: "6 Av", stopID: "D18", feed: "nyct/gtfs-bdfm", routes: ["F", "M"], walkMinutes: 0 },
            { name: "23 St", subtitle: "Lexington Av", stopID: "634", feed: "nyct/gtfs", routes: ["6"], walkMinutes: 0 },
        ];
        const TRAINS_PER_DIRECTION = 2;
        const REFRESH_SECONDS = 20;
        const OFFLINE_SECONDS = 90;
        const RELOAD_HOURS = 6;

        const FEED_BASE_URL = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/";
        const DIRECTION_LABELS = { N: "Uptown", S: "Downtown" };
        const ROUTE_COLORS = { F: "orange", M: "orange", 6: "green" };

        // names of every stop the F, M and 6 serve, from the mta static gtfs
        const STOP_NAMES = {
            "601": "Pelham Bay Park",
            "602": "Buhre Av",
            "603": "Middletown Rd",
            "604": "Westchester Sq-E Tremont Av",
            "606": "Zerega Av",
            "607": "Castle Hill Av",
            "608": "Parkchester",
            "609": "St Lawrence Av",
            "610": "Morrison Av-Soundview",
            "611": "Elder Av",
            "612": "Whitlock Av",
            "613": "Hunts Point Av",
            "614": "Longwood Av",
            "615": "E 149 St",
            "616": "E 143 St-St Mary's St",
            "617": "Cypress Av",
            "618": "Brook Av",
            "619": "3 Av-138 St",
            "621": "125 St",
            "622": "116 St",
            "623": "110 St",
            "624": "103 St",
            "625": "96 St",
            "626": "86 St",
            "627": "77 St",
            "628": "68 St-Hunter College",
            "629": "59 St",
            "630": "51 St",
            "631": "Grand Central-42 St",
            "632": "33 St",
            "633": "28 St",
            "634": "23 St-Baruch College",
            "635": "14 St-Union Sq",
            "636": "Astor Pl",
            "637": "Bleecker St",
            "638": "Spring St",
            "639": "Canal St",
            "640": "Brooklyn Bridge-City Hall",
            "A41": "Jay St-MetroTech",
            "B04": "21 St-Queensbridge",
            "B06": "Roosevelt Island",
            "B08": "Lexington Av/63 St",
            "B10": "57 St",
            "D15": "47-50 Sts-Rockefeller Ctr",
            "D16": "42 St-Bryant Pk",
            "D17": "34 St-Herald Sq",
            "D18": "23 St",
            "D19": "14 St",
            "D20": "W 4 St-Wash Sq",
            "D21": "Broadway-Lafayette St",
            "D42": "W 8 St-NY Aquarium",
            "D43": "Coney Island-Stillwell Av",
            "F01": "Jamaica-179 St",
            "F02": "169 St",
            "F03": "Parsons Blvd",
            "F04": "Sutphin Blvd",
            "F05": "Briarwood",
            "F06": "Kew Gardens-Union Tpke",
            "F07": "75 Av",
            "F09": "Court Sq-23 St",
            "F11": "Lexington Av/53 St",
            "F12": "5 Av/53 St",
            "F14": "2 Av",
            "F15": "Delancey St-Essex St",
            "F16": "East Broadway",
            "F18": "York St",
            "F20": "Bergen St",
            "F21": "Carroll St",
            "F22": "Smith-9 Sts",
            "F23": "4 Av-9 St",
            "F24": "7 Av",
            "F25": "15 St-Prospect Park",
            "F26": "Fort Hamilton Pkwy",
            "F27": "Church Av",
            "F29": "Ditmas Av",
            "F30": "18 Av",
            "F31": "Avenue I",
            "F32": "Bay Pkwy",
            "F33": "Avenue N",
            "F34": "Avenue P",
            "F35": "Kings Hwy",
            "F36": "Avenue U",
            "F38": "Avenue X",
            "F39": "Neptune Av",
            "G08": "Forest Hills-71 Av",
            "G09": "67 Av",
            "G10": "63 Dr-Rego Park",
            "G11": "Woodhaven Blvd",
            "G12": "Grand Av-Newtown",
            "G13": "Elmhurst Av",
            "G14": "Jackson Hts-Roosevelt Av",
            "G15": "65 St",
            "G16": "Northern Blvd",
            "G18": "46 St",
            "G19": "Steinway St",
            "G20": "36 St",
            "G21": "Queens Plaza",
            "M01": "Middle Village-Metropolitan Av",
            "M04": "Fresh Pond Rd",
            "M05": "Forest Av",
            "M06": "Seneca Av",
            "M08": "Myrtle-Wyckoff Avs",
            "M09": "Knickerbocker Av",
            "M10": "Central Av",
            "M11": "Myrtle Av",
            "M12": "Flushing Av",
            "M13": "Lorimer St",
            "M14": "Hewes St",
            "M16": "Marcy Av",
            "M18": "Delancey St-Essex St",
        };

        const sign = document.getElementById("sign");
        const footerClock = document.getElementById("footerClock");
        const footerStatus = document.getElementById("footerStatus");

        let stationArrivals = STATIONS.map(() => []);
        let lastUpdate = 0;
        let refreshFailed = false;

        /********************* Feed Decoder *********************/

        // the feeds are gtfs-realtime protobuf, and we only read a handful of fields:
        // entity 2, trip_update 3, trip 1, route_id 5, stop_time_update 2, stop_id 4, arrival 2, departure 3, time 2

        // one varint, using multiplication so 64-bit times don't overflow bitwise math
        function varint(bytes, position) {
            let result = 0;
            let multiplier = 1;
            let byte;
            do {
                byte = bytes[position.index];
                position.index += 1;
                result += (byte & 0x7f) * multiplier;
                multiplier *= 128;
            } while (byte & 0x80);
            return result;
        }

        // hand each field to the callback as a number, or a byte range for strings and nested messages
        function readFields(bytes, range, callback) {
            const position = { index: range.start };
            while (position.index < range.end) {
                // split the tag into field number and wire type
                const tag = varint(bytes, position);
                const field = Math.floor(tag / 8);
                const wireType = tag % 8;

                // varint
                if (wireType === 0) {
                    callback(field, varint(bytes, position));
                }

                // length-delimited
                else if (wireType === 2) {
                    const length = varint(bytes, position);
                    callback(field, { start: position.index, end: position.index + length });
                    position.index += length;
                }

                // fixed 64 bit, never needed
                else if (wireType === 1) {
                    position.index += 8;
                }

                // fixed 32 bit, never needed
                else if (wireType === 5) {
                    position.index += 4;
                }

                // anything else means a corrupt feed
                else {
                    throw new Error(`Unsupported protobuf wire type ${wireType}`);
                }
            }
        }

        // text of a string field
        function fieldText(bytes, range) {
            return new TextDecoder().decode(bytes.subarray(range.start, range.end));
        }

        // time from a StopTimeEvent
        function eventTime(bytes, range) {
            let time = 0;
            readFields(bytes, range, (field, value) => {
                if (field === 2) {
                    time = value;
                }
            });
            return time;
        }

        // stop id and time from a StopTimeUpdate, preferring arrival over departure
        function stopTime(bytes, range) {
            let stopID = "";
            let arrival = 0;
            let departure = 0;
            readFields(bytes, range, (field, value) => {
                if (field === 4) {
                    stopID = fieldText(bytes, value);
                }
                if (field === 2) {
                    arrival = eventTime(bytes, value);
                }
                if (field === 3) {
                    departure = eventTime(bytes, value);
                }
            });
            return { stopID, time: arrival || departure };
        }

        // route and remaining stops from a TripUpdate
        function tripUpdate(bytes, range) {
            const trip = { route: "", stops: [] };
            readFields(bytes, range, (field, value) => {
                // route id lives in the trip descriptor
                if (field === 1) {
                    readFields(bytes, value, (descriptorField, descriptorValue) => {
                        if (descriptorField === 5) {
                            trip.route = fieldText(bytes, descriptorValue);
                        }
                    });
                }

                // one remaining stop
                if (field === 2) {
                    trip.stops.push(stopTime(bytes, value));
                }
            });
            return trip;
        }

        // every trip in a feed
        function feedTrips(bytes) {
            const trips = [];
            readFields(bytes, { start: 0, end: bytes.length }, (field, entity) => {
                // skip the header
                if (field !== 2) {
                    return;
                }

                // skip vehicle positions and alerts
                readFields(bytes, entity, (entityField, value) => {
                    if (entityField !== 3) {
                        return;
                    }
                    trips.push(tripUpdate(bytes, value));
                });
            });
            return trips;
        }

        /********************* Arrivals *********************/

        // upcoming arrivals at one station, soonest first
        function upcomingArrivals(station, trips, now) {
            const cutoff = now + station.walkMinutes * 60;
            const arrivals = [];
            trips.forEach(trip => {
                // skip other routes, express runs ("6X") count as their route
                const route = trip.route.replace(/X$/, "");
                if (!station.routes.includes(route)) {
                    return;
                }

                // skip trips that don't stop here
                const stop = trip.stops.find(stop => stop.stopID.slice(0, -1) === station.stopID);
                if (!stop) {
                    return;
                }

                // skip trains we can't make, and trains sitting at their terminal
                const lastStop = trip.stops.at(-1);
                if (stop.time < cutoff || stop === lastStop) {
                    return;
                }

                // name the train by its last stop, or its direction when that stop is off the line
                const direction = stop.stopID.slice(-1);
                const destination = STOP_NAMES[lastStop.stopID.slice(0, -1)] ?? DIRECTION_LABELS[direction];

                arrivals.push({ route: trip.route, direction, destination, time: stop.time });
            });
            return arrivals.sort((a, b) => a.time - b.time);
        }

        // download and decode one feed
        async function liveTrips(feed) {
            const response = await fetch(`${FEED_BASE_URL}${encodeURIComponent(feed)}`, { cache: "no-store" });

            // fetch only throws on network errors, so check the status too
            if (!response.ok) {
                throw new Error(`MTA feed ${feed} returned ${response.status}`);
            }

            return feedTrips(new Uint8Array(await response.arrayBuffer()));
        }

        /********************* Refresh *********************/

        // download every feed and rebuild the arrivals
        async function refreshArrivals() {
            const feeds = [...new Set(STATIONS.map(station => station.feed))];
            try {
                // download the feeds together
                const tripsByFeed = await Promise.all(feeds.map(feed => liveTrips(feed)));

                // pick out each station's trains
                const now = Date.now() / 1000;
                stationArrivals = STATIONS.map(station => upcomingArrivals(station, tripsByFeed[feeds.indexOf(station.feed)], now));
                lastUpdate = Date.now();
                refreshFailed = false;
            } catch (error) {
                // keep the last good arrivals on screen, their minutes keep counting down
                console.error(error);
                refreshFailed = true;
            } finally {
                renderSign();
            }
        }

        /********************* Render *********************/

        // draw both stations and the footer
        function renderSign() {
            const now = Date.now() / 1000;

            // one train: bullet, destination and minutes
            function rowHTML(arrival) {
                // minutes, or "Now" when it's in the station
                const minutes = Math.max(0, Math.floor((arrival.time - now) / 60));
                let minutesHTML = `${minutes}<span class="signStationRowMinutesUnit">min</span>`;
                if (minutes === 0) {
                    minutesHTML = "Now";
                }

                // bullet colour, and a diamond for express runs
                const route = arrival.route.replace(/X$/, "");
                let bulletClasses = ROUTE_COLORS[route] ?? "";
                if (route !== arrival.route) {
                    bulletClasses += " express";
                }

                // landscape shows the part before the dash ("Coney Island"), portrait the full name
                const shortDestination = arrival.destination.split("-")[0];

                return `
                    <div class="signStationRow">
                        <div class="signStationRowBullet ${bulletClasses}">
                            <span class="signStationRowBulletText">${route}</span>
                        </div>
                        <p class="signStationRowDestination">
                            <span class="signStationRowDestinationFull">${arrival.destination}</span>
                            <span class="signStationRowDestinationShort">${shortDestination}</span>
                        </p>
                        <p class="signStationRowMinutes">${minutesHTML}</p>
                    </div>
                `;
            }

            // build every station
            let signHTML = "";
            STATIONS.forEach((station, index) => {
                // drop trains that have already left
                const arrivals = stationArrivals[index].filter(arrival => arrival.time > now - 30);

                signHTML += `
                    <div class="signStation">
                        <h1 class="signStationTitle">
                            ${station.name}
                            <span class="signStationTitleSubtitle">${station.subtitle}</span>
                        </h1>
                `;

                // next few trains each way
                Object.entries(DIRECTION_LABELS).forEach(([direction, label]) => {
                    signHTML += `<p class="signStationDirection">${label}</p>`;

                    // placeholder when nothing is coming
                    const trains = arrivals.filter(arrival => arrival.direction === direction).slice(0, TRAINS_PER_DIRECTION);
                    if (!trains.length) {
                        signHTML += `<p class="signStationEmpty">No trains scheduled</p>`;
                        return;
                    }

                    trains.forEach(train => {
                        signHTML += rowHTML(train);
                    });
                });

                signHTML += `</div>`;
            });

            // insert once
            sign.innerHTML = signHTML;

            // clock
            footerClock.textContent = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

            // status: loading, live, or offline
            const updatedAt = new Date(lastUpdate).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
            let statusText = "Loading…";
            let offline = false;
            if (lastUpdate) {
                statusText = "Live";
            }
            if (lastUpdate && Date.now() - lastUpdate > OFFLINE_SECONDS * 1000) {
                statusText = `Offline since ${updatedAt}. Please check the Wi-Fi connection.`;
                offline = true;
            }
            if (!lastUpdate && refreshFailed) {
                statusText = "Can't reach the MTA. Please check the Wi-Fi connection.";
                offline = true;
            }
            footerStatus.textContent = statusText;
            footerStatus.classList.toggle("offline", offline);
        }

        /********************* Setup *********************/

        // load trains now, then keep the sign current
        async function setup() {
            await refreshArrivals();
            setInterval(refreshArrivals, REFRESH_SECONDS * 1000);

            // tick the minutes and clock between refreshes
            setInterval(renderSign, 1000);

            // reload a few times a day so a page left open for weeks starts fresh
            setTimeout(() => window.location.reload(), RELOAD_HOURS * 60 * 60 * 1000);
        }

        setup();
    </script>
</body>
</html>
